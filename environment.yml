# Conda/mamba environment for StoiAgent:
#   mamba env create -f environment.yml
#   mamba activate stoiagent
name: stoiagent
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.11
  - pip
  # Template search: jackhmmer (HMMER), hhmake and hhsearch (HH-suite)
  - hmmer
  - hhsuite
  # Used by scripts/setup_databases.sh and AlphaFold 3's fetch_databases.sh
  - wget
  - zstd
  - pip:
      # PyTorch built for CUDA 12.6 runs on NVIDIA drivers 525 and newer; the
      # default PyPI build needs a CUDA 13 driver (580+).
      - --extra-index-url https://download.pytorch.org/whl/cu126
      - torch==2.14.1+cu126
      # Must match the torch build above; the default PyPI torchvision
      # fails to import against this torch.
      - torchvision==0.29.1+cu126
      - -e .
